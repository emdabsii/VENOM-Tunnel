name: Build & Release Venom Tunnel

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    strategy:
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            rust_target: x86_64-unknown-linux-gnu
            cc: gcc
          - arch: arm64
            goarch: arm64
            rust_target: aarch64-unknown-linux-gnu
            cc: aarch64-linux-gnu-gcc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install Rust target & cross-compiler
        run: |
          rustup target add ${{ matrix.rust_target }}
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          fi
      - name: Build C sysopt
        run: |
          ${{ matrix.cc }} -O2 -s sysopt/sysopt.c -o venom-sysopt-linux-${{ matrix.arch }}
      - name: Build Rust netprobe
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cd netprobe
          cargo build --release --target ${{ matrix.rust_target }}
          cp target/${{ matrix.rust_target }}/release/venom-netprobe ../venom-netprobe-linux-${{ matrix.arch }}
      - name: Build Go venomd (with embedded Graphical Web Panel)
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w" -o ../venomd-linux-${{ matrix.arch }} .
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: |
            venomd-linux-${{ matrix.arch }}
            venom-netprobe-linux-${{ matrix.arch }}
            venom-sysopt-linux-${{ matrix.arch }}

  release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          files: release-files/*
