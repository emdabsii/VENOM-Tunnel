<style>
:root, [data-theme="toxic"] {
  --bg: #040709;
  --bg2: #091015;
  --card: rgba(12, 20, 26, 0.86);
  --border: rgba(34, 255, 102, 0.18);
  --border-hi: rgba(34, 255, 102, 0.45);
  --accent: #22ff66;
  --accent2: #00e5ff;
  --glow: rgba(34, 255, 102, 0.28);
  --text: #eef7f1;
  --muted: #7c9689;
  --danger: #ff3b5c;
  --warn: #fbbf24;
  --grid: rgba(34, 255, 102, 0.045);
}
[data-theme="carnage"] {
  --bg: #080406;
  --bg2: #14080d;
  --card: rgba(24, 10, 16, 0.88);
  --border: rgba(255, 42, 85, 0.22);
  --border-hi: rgba(255, 42, 85, 0.55);
  --accent: #ff2a55;
  --accent2: #ff9900;
  --glow: rgba(255, 42, 85, 0.30);
  --text: #fff0f3;
  --muted: #a87b86;
  --danger: #ff5252;
  --warn: #f59e0b;
  --grid: rgba(255, 42, 85, 0.045);
}
[data-theme="cyber"] {
  --bg: #040814;
  --bg2: #0a1226;
  --card: rgba(13, 22, 46, 0.88);
  --border: rgba(56, 189, 248, 0.22);
  --border-hi: rgba(56, 189, 248, 0.55);
  --accent: #38bdf8;
  --accent2: #a855f7;
  --glow: rgba(56, 189, 248, 0.30);
  --text: #edf6ff;
  --muted: #7e95bb;
  --danger: #f43f5e;
  --warn: #facc15;
  --grid: rgba(56, 189, 248, 0.045);
}
[data-theme="light"] {
  --bg: #eef3f8;
  --bg2: #ffffff;
  --card: rgba(255, 255, 255, 0.94);
  --border: rgba(15, 23, 42, 0.10);
  --border-hi: rgba(5, 150, 105, 0.42);
  --accent: #059669;
  --accent2: #0284c7;
  --glow: rgba(5, 150, 105, 0.16);
  --text: #0f172a;
  --muted: #64748b;
  --danger: #dc2626;
  --warn: #d97706;
  --grid: rgba(15, 23, 42, 0.035);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 18% 12%, var(--glow), transparent 36%),
    radial-gradient(circle at 86% 84%, rgba(0,229,255,0.12), transparent 34%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 34px 34px, 34px 34px;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
html[lang="fa"] body { font-family: 'Vazirmatn', 'DejaVu Sans', Tahoma, sans-serif; }
html[lang="en"] body, html[lang="ru"] body { font-family: 'Plus Jakarta Sans', 'DejaVu Sans', system-ui, sans-serif; }
html[lang="zh"] body { font-family: 'Noto Sans SC', 'DejaVu Sans', sans-serif; }
.mono { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace !important; direction: ltr; unicode-bidi: isolate; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  backdrop-filter: blur(16px);
  transition: border-color .2s, transform .2s, box-shadow .2s;
}
.card:hover { border-color: var(--border-hi); }
.glow { box-shadow: 0 0 36px var(--glow), inset 0 1px 0 rgba(255,255,255,0.06); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px; border-radius: 12px; border: 1px solid var(--border);
  background: rgba(255,255,255,0.04); color: var(--text); font-weight: 700;
  font-size: 13px; cursor: pointer; transition: all .18s; font-family: inherit;
}
.btn:hover { border-color: var(--accent); background: rgba(255,255,255,0.09); }
.btn-primary { background: var(--accent); color: #041008; border-color: transparent; box-shadow: 0 0 22px var(--glow); }
.btn-primary:hover { filter: brightness(1.08); background: var(--accent); color: #041008; }
.btn-danger { color: var(--danger); border-color: rgba(255,59,92,0.3); }
.btn-sm { padding: 7px 12px; font-size: 12px; border-radius: 10px; }

.badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
  border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .3px;
}
.badge-ok { background: rgba(34,255,102,0.14); color: var(--accent); border: 1px solid rgba(34,255,102,0.35); }
.badge-info { background: rgba(0,229,255,0.13); color: var(--accent2); border: 1px solid rgba(0,229,255,0.32); }
.badge-warn { background: rgba(251,191,36,0.15); color: var(--warn); border: 1px solid rgba(251,191,36,0.35); }
.badge-err { background: rgba(255,59,92,0.15); color: var(--danger); border: 1px solid rgba(255,59,92,0.35); }

.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); display: inline-block; }
.dot-err { background: var(--danger); box-shadow: 0 0 10px var(--danger); }

.input {
  width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border);
  background: rgba(0,0,0,0.28); color: var(--text); font-size: 13px; outline: none; font-family: inherit;
}
[data-theme="light"] .input { background: rgba(15,23,42,0.04); }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }

/* Layout */
.app-shell { display: flex; min-height: 100vh; }
.sidebar {
  width: 256px; padding: 22px 16px; background: var(--bg2);
  border-inline-end: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
}
.nav-item {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  border-radius: 14px; border: 1px solid transparent; background: transparent;
  color: var(--muted); font-weight: 700; font-size: 13.5px; cursor: pointer;
  transition: all .18s; width: 100%; text-align: start; font-family: inherit;
}
.nav-item:hover { color: var(--text); background: rgba(255,255,255,0.04); }
.nav-item.active {
  color: #041008; background: var(--accent);
  box-shadow: 0 0 24px var(--glow);
}
.main { flex: 1; padding: 24px 28px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }

.kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }

/* Animations */
@keyframes flow { from { stroke-dashoffset: 48; } to { stroke-dashoffset: 0; } }
@keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: .72; } }
@keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.packet-line { stroke-dasharray: 8 8; animation: flow 1.1s linear infinite; }
.venom-pulse { animation: pulse 2.2s ease-in-out infinite; }
.spin-slow { animation: spinSlow 9s linear infinite; transform-origin: center; }

/* Splash & Login */
.center-screen {
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
}
.login-box { width: 100%; max-width: 440px; padding: 34px; position: relative; overflow: hidden; }
.log-box {
  background: #030608; border: 1px solid var(--border); border-radius: 16px;
  padding: 16px; font-size: 12px; line-height: 1.75; overflow: auto; max-height: 410px;
  color: #b7f7c9;
}
.log-info { color: #22ff66; }
.log-warn { color: #fbbf24; }
.log-err  { color: #ff3b5c; }
.pill-row { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  padding: 5px 10px; border-radius: 9px; font-size: 11px; font-weight: 700;
  border: 1px solid var(--border); background: rgba(255,255,255,0.03); color: var(--muted); cursor: pointer;
}
.pill.active { background: var(--accent); color: #041008; border-color: transparent; }

.theme-swatch {
  width: 24px; height: 24px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: .18s;
}
.theme-swatch.active { border-color: #fff; transform: scale(1.12); }

.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.72); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50;
}
.modal-card { width: 100%; max-width: 560px; padding: 26px; max-height: 90vh; overflow-y: auto; }

@media (max-width: 1050px) {
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .sidebar { width: 210px; }
}
@media (max-width: 760px) {
  .app-shell { flex-direction: column; }
  .sidebar { width: 100%; border-inline-end: none; border-bottom: 1px solid var(--border); }
}

  const r = 24, c = 2 * Math.PI * r, off = c * (1 - Math.min(100, Math.max(0, pct)) / 100);
  return `<svg width="62" height="62" viewBox="0 0 62 62">
    <circle cx="31" cy="31" r="${r}" stroke="rgba(255,255,255,0.09)" stroke-width="5.5" fill="none"/>
    <circle cx="31" cy="31" r="${r}" stroke="${color}" stroke-width="5.5" fill="none"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
      stroke-linecap="round" transform="rotate(-90 31 31)"/>
    <text x="31" y="35" text-anchor="middle" fill="var(--text)" font-size="12" font-weight="700" class="mono">${Math.round(pct)}%</text>
  </svg>`;
}

function setLang(l) { state.lang = l; applyDoc(); render(); }
function setTheme(th) { state.theme = th; applyDoc(); render(); }
function applyDoc() {
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === 'fa' ? 'rtl' : 'ltr';
  document.documentElement.setAttribute('data-theme', state.theme);
}

async function fetchLive() {
  if (isDemo) return;
  try {
    const [tRes, telRes, intlRes] = await Promise.all([
      fetch('/api/tunnels').then(r => r.ok ? r.json() : null),
      fetch('/api/system/telemetry').then(r => r.ok ? r.json() : null),
      fetch('/api/system/intl').then(r => r.ok ? r.json() : null)
    ]);
    if (tRes && tRes.tunnels) { state.tunnels = tRes.tunnels; state.serverIP = tRes.server_ip || state.serverIP; }
    if (telRes && telRes.cpu_pct !== undefined) state.telemetry = telRes;
    if (intlRes && intlRes.checks) state.intl = intlRes;
    render();
  } catch (e) {}
}

async function doLogin(ev) {
  ev.preventDefault();
  const u = document.getElementById('login-user').value;
  const p = document.getElementById('login-pass').value;
  state.screen = 'splash';
  render();
  if (!isDemo) {
    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      if (!r.ok) {
        setTimeout(() => { state.screen = 'login'; alert('Invalid credentials'); render(); }, 900);
        return;
      }
    } catch (e) {}
  }
  setTimeout(() => { state.screen = 'app'; fetchLive(); render(); }, 2100);
}

function copyText(txt) {
  navigator.clipboard?.writeText(txt).catch(() => {});
  state.copied = true; render();
  setTimeout(() => { state.copied = false; render(); }, 1800);
}

function openCreateModal() { state.editTarget = null; state.modal = 'tunnel'; render(); }
function openEditModal(name) { state.editTarget = state.tunnels.find(x => x.name === name) || null; state.modal = 'tunnel'; render(); }

async function saveTunnel() {
  const payload = {
    name: document.getElementById('m-name').value.trim(),
    engine: document.getElementById('m-engine').value,
    role: document.getElementById('m-role').value,
    control_port: parseInt(document.getElementById('m-cport').value, 10) || 443,
    remote_ip: document.getElementById('m-remote').value.trim(),
    ports: document.getElementById('m-ports').value.trim(),
    token: document.getElementById('m-token').value.trim()
  };
  if (!isDemo) {
    await fetch('/api/tunnels', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    await fetchLive();
  }
  state.modal = null; render();
}

async function restartTunnel(name) {
  if (!isDemo) {
    await fetch('/api/tunnels/action', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name, action: 'restart' }) });
    await fetchLive();
  }
}
async function runProbe() {
  if (isDemo) return;
  const h = document.getElementById('probe-host').value, p = document.getElementById('probe-port').value;
  const r = await fetch(`/api/system/probe?host=${encodeURIComponent(h)}&port=${encodeURIComponent(p)}&count=10`).then(x => x.json());
  if (r && r.sent) { state.probeResult = r; render(); }
}
async function runOptimize() {
  if (!isDemo) { await fetch('/api/system/optimize', { method: 'POST' }); alert('Kernel BBR + FQ + RPS Applied!'); }
}

            <circle cx="64" cy="64" r="58" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="28 14" fill="none"/>
            <circle cx="64" cy="64" r="46" stroke="var(--accent2)" stroke-width="1.5" stroke-dasharray="10 10" fill="none"/>
          </svg>
          <div class="venom-pulse">${venomLogoSVG(62)}</div>
        </div>
        <div class="mono" style="font-size:20px;font-weight:800;letter-spacing:3px;color:var(--accent)">${t.brand}</div>
        <div style="font-size:13px;color:var(--text);margin-top:10px">${t.connecting}</div>
        <div style="margin-top:22px;display:flex;flex-direction:column;gap:8px;text-align:start">
          <div class="badge badge-ok" style="justify-content:space-between;padding:8px 14px"><span>✓ ${t.stage1}</span><span class="mono">OK</span></div>
          <div class="badge badge-ok" style="justify-content:space-between;padding:8px 14px"><span>✓ ${t.stage2}</span><span class="mono">56 PORTS</span></div>
          <div class="badge badge-info" style="justify-content:space-between;padding:8px 14px"><span>◉ ${t.stage3}</span><span class="mono">41ms</span></div>
        </div>
      </div>
    </div>`;
    return;
  }

  if (state.screen === 'login') {
    root.innerHTML = `<div class="center-screen">
      <form class="card glow login-box" onsubmit="doLogin(event)">
        <div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:26px">
          <div class="venom-pulse">${venomLogoSVG(68)}</div>
          <div class="mono" style="font-size:24px;font-weight:800;letter-spacing:3px;color:var(--accent)">${t.brand}</div>
          <div style="font-size:13px;color:var(--muted)">${t.loginTitle}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:14px">
          <input id="login-user" class="input mono" placeholder="${t.user}" value="${state.username}" required />
          <input id="login-pass" type="password" class="input mono" placeholder="${t.pass}" value="••••••••••••••" required />
          <button type="submit" class="btn btn-primary" style="width:100%;padding:13px;font-size:14px">${t.connectBtn}</button>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:22px;padding-top:16px;border-top:1px solid var(--border)">
          <div class="pill-row">
            ${['fa','en','zh','ru'].map(l => `<button type="button" class="pill ${state.lang===l?'active':''}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join('')}
          </div>
          <div style="display:flex;gap:6px">
            ${[['toxic','#22ff66'],['carnage','#ff2a55'],['cyber','#38bdf8'],['light','#059669']].map(([th,col]) =>
              `<button type="button" class="theme-swatch ${state.theme===th?'active':''}" style="background:${col}" onclick="setTheme('${th}')"></button>`
            ).join('')}
          </div>
        </div>
      </form>
    </div>`;
    return;
  }

  root.innerHTML = `<div class="app-shell">
    <aside class="sidebar">
      <div style="display:flex;align-items:center;gap:12px;padding:6px 6px 18px;border-bottom:1px solid var(--border);margin-bottom:10px">
        ${venomLogoSVG(38)}
        <div>
          <div class="mono" style="font-size:15px;font-weight:800;letter-spacing:1.5px;color:var(--accent)">VENOM</div>
          <div class="mono" style="font-size:10px;color:var(--muted)">v2.0 · POLYGLOT</div>
        </div>
      </div>
      ${[
        ['dashboard', '◈', t.navDash],
        ['tunnels',   '⬡', t.navTun],
        ['diag',      '⚡', t.navDiag],
        ['pair',      '∞', t.navPair],
        ['settings',  '⚙', t.navSet]
      ].map(([id, ic, lb]) => `
        <button class="nav-item ${state.view===id?'active':''}" onclick="state.view='${id}';render()">
          <span style="font-size:16px">${ic}</span> <span>${lb}</span>
        </button>
      `).join('')}

      <div style="margin-top:auto;padding-top:16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:12px">
        <div class="pill-row">
          ${['fa','en','zh','ru'].map(l => `<button class="pill ${state.lang===l?'active':''}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join('')}
        </div>
        <div style="display:flex;gap:8px">
          ${[['toxic','#22ff66'],['carnage','#ff2a55'],['cyber','#38bdf8'],['light','#059669']].map(([th,col]) =>
            `<button class="theme-swatch ${state.theme===th?'active':''}" style="background:${col}" onclick="setTheme('${th}')"></button>`
          ).join('')}
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <div style="font-size:20px;font-weight:800">${t.brand} <span class="badge badge-ok mono">ONLINE</span></div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">${t.sub}</div>
        </div>
        <div class="pill-row">
          <span class="badge badge-info mono">IP: ${state.serverIP}</span>
          <span class="badge badge-warn mono">PORT: ${state.panelPort}</span>
        </div>
      </div>

      ${state.view === 'dashboard' ? renderDashboard(t) : ''}
      ${state.view === 'tunnels'   ? renderTunnelsGrid(t) : ''}
      ${state.view === 'diag'      ? renderDiag(t) : ''}
      ${state.view === 'pair'      ? renderPairAndThemes(t) : ''}
      ${state.view === 'settings'  ? renderSettings(t) : ''}
    </main>
  </div>
  ${renderModal(t)}`;
}

applyDoc();
render();
if (state.screen === 'app') fetchLive();
</script>
</body>
</html>
